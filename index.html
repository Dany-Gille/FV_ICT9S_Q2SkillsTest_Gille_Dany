 <div class="container">
        <div class="row justify-content-center">
            <div class="col text-center mb-4">
            <h1 class="text-center text-white">Student Enrollment Form</h1>
            <p class="text-center text-white">Fill out this form below for the upcoming school year.</p>
        </div>

<div class="container-fluid bg-white rounded-4 bg-opacity-75 justify-content-center">
<div class="row">
<div class="col-md-6 mt-3">

    <div class="fw-bold mb-2">
    <label>Student Information</label>
    </div>

    <label for="firstname" class="form-label">First Name:</label>
    <input type="firstname" class="form-control" placeholder="Enter your first name" required>
</div>

<div class="col-md-6 mt-5">
    <label for="firstname" class="form-label">Last Name:</label>
    <input type="firstname" class="form-control" placeholder="Enter your first name" required>
    
</div>

<div class="row g-3">

    <div class="col-md-4">Birth Date
    <input type="date" class="form-control">
</div>

    <div class="col-md-4">Gender
    <select class="form-select">
    <option value="5">Select...</option>
    <option value="3">Male</option>
    <option value="1">Female</option>
    </select>
    </div>

    <div class="col-md-4">Grade Level
    <select class="form-select">
    <option value="8">Select...</option>
    <option value="5">Grade-7</option>
    <option value="3">Grade-8</option>
    <option value="1">Grade-9</option>
    </select>
    </div>
</div>

<div class="container-fluid mt-4">
    <div class="row">
    <div class="col">
    <label for="email" class="form-label">Contact Details</label>
    <input type="email" class="form-control" placeholder="Enter your Email Adress" required>
</div>

<div class="col">
    <label for="email" class="form-label">Contact Numbers</label>
    <input type="email" class="form-control" placeholder="Enter your contact number" required>

</div>

<div class="container mt-4">
    <div class="row">
    <div class="col">

    <label class="fw-bold mb-2">Other Information</label>
    <div>
    <label>Mode of Learning</label>

    <div class="form-check mt-2">
    <input type="checkbox" id="checkbox" class="form-check-input">
    <label for="checkbox" class="form-label">Online</label>
    </div>

    <div class="form-check">
    <input type="checkbox" id="checkbox" class="form-check-input">
    <label for="checkbox" class="form-label">Face to face</label>
    </div>

    <div class="form-check mt-1">
    <input type="checkbox" id="checkbox" class="form-check-input">
    <label for="checkbox" class="form-label">I verify that all submitted information is true and complete.</label>
    </div>

    <div class="text-center">
        <button type="submit" class="btn btn-primary rounded-4 mb-4 w-25 mt-3">Submit Enrollment</button>
    </div>
